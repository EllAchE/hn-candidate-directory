name = "hn-candidate-directory"
main = "worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
# Cloudflare's default rewrites `/x.html` to `/x` and 404s the original. The Worker
# and the smoke address assets by their real filenames, so serve paths literally.
html_handling = "none"

[triggers]
crons = ["17 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hn-candidate-directory"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[queues.producers]]
binding = "SUBMISSION_QUEUE"
queue = "hn-candidate-submissions"

[[queues.consumers]]
queue = "hn-candidate-submissions"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# Free per-colo pre-filter in front of the D1 counters. It is best effort and never authoritative:
# every write quota is still enforced in D1, so dropping this binding costs throughput, not safety.
# `namespace_id` is local to this Worker and is not an account resource to provision.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
